# Create from this Blueprint only after importing the seed and setting private secrets.
services:
  - type: web
    name: sewasetu-evaluation
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render.Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: sewasetu
      - key: SUPABASE_URL
        value: https://ipbcvfrdeeqvbhysscdi.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: age-proofs
      - key: DOCUMENT_STORAGE
        value: supabase
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: assessor
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENABLE_LOCAL_SMS_CONSOLE
        value: '0'
      - key: CITIZEN_MCP_BLOCKS
        value: Sonari,Rajapara
