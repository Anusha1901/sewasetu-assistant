# Standalone VM deployment; do not combine with development Compose files.
name: sewasetu-eval

x-app-environment: &app-environment
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Generate production configuration first}
  ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  CITIZEN_MCP_BLOCKS: ${CITIZEN_MCP_BLOCKS:-Sonari,Rajapara}
  CITIZEN_MCP_ALLOWED_ORIGINS: ${CITIZEN_MCP_ALLOWED_ORIGINS:-}
  OFFICER_MCP_ALLOWED_ORIGINS: ${OFFICER_MCP_ALLOWED_ORIGINS:-}
  ENABLE_LOCAL_SMS_CONSOLE: "0"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sewasetu -d sewasetu"]
      interval: 5s
      timeout: 5s
      retries: 120
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build: ../app
    command: ["python", "/app/scripts/apply_migrations.py"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ${SECRETS_DIR:-./secrets}/app.ini:/app/config/app.ini:ro
    networks: [backend]
    logging: *logging

  app:
    build: ../app
    restart: unless-stopped
    # Trust forwarding headers only because this container has no published host port;
    # the sole Internet-facing ingress is the Caddy service on the private frontend network.
    command: ["uvicorn", "gateway:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${MCP_WORKERS:-2}", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    environment: *app-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      smsgw: {condition: service_started}
    volumes:
      - ${SECRETS_DIR:-./secrets}/app.ini:/app/config/app.ini:ro
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *logging

  scheduler:
    build: ../app
    restart: unless-stopped
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      smsgw: {condition: service_started}
    volumes:
      - ${SECRETS_DIR:-./secrets}/app.ini:/app/config/app.ini:ro
      - applogs:/var/log/sewasetu
    networks: [backend]
    logging: *logging

  smsgw:
    build:
      context: ../smsgw
      dockerfile: ../deploy/smsgw.Dockerfile
    restart: unless-stopped
    networks: [backend]
    logging: *logging

  edge:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set the DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
      EVAL_SMS_USERNAME: ${EVAL_SMS_USERNAME:?Set simulator username}
      EVAL_SMS_PASSWORD_HASH: ${EVAL_SMS_PASSWORD_HASH:?Generate a simulator password hash}
    ports:
      - "${EDGE_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${EDGE_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on:
      app: {condition: service_healthy}
    logging: *logging

secrets:
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  pgdata: {}
  uploads: {}
  applogs: {}
  caddy_data: {}
  caddy_config: {}
